
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>MY FAV PLAYLISTE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:45px 15px 30px;background:radial-gradient(ellipse at top,#45101b,#080808 72%);border-bottom:1px solid #292929}
.logo{font-size:clamp(32px,8vw,52px);font-weight:900;letter-spacing:3px}
.red{color:#ff1744}
.subtitle{margin-top:12px;color:#999;font-size:10px;letter-spacing:4px}
.status{display:inline-block;margin-top:20px;padding:8px 13px;border:1px solid #591522;border-radius:30px;color:#ff647e;font-size:10px;letter-spacing:2px}
main{max-width:1050px;margin:auto;padding:20px 15px 50px}
.intro{padding:15px 0 25px;color:#aaa;line-height:1.8;font-size:14px}
h2{font-size:17px;letter-spacing:2px;border-left:3px solid #ff1744;padding-left:12px;margin:28px 0 17px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{display:block;min-width:0;overflow:hidden;background:#151515;border:1px solid #292929;border-radius:8px;color:#fff;text-decoration:none}
.card:hover{border-color:#ff1744}
.thumb{position:relative;aspect-ratio:16/9;background:#222}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.play{position:absolute;inset:0;display:grid;place-items:center;font-size:27px;background:#0003}
.info{padding:11px}
.number{font-size:10px;color:#ff1744;letter-spacing:2px;margin-bottom:7px}
.name{font-size:13px;font-weight:bold;line-height:1.5;overflow-wrap:anywhere}
.note{font-size:10px;color:#888;margin-top:6px}
.playlist{padding:18px 12px;background:linear-gradient(135deg,#291018,#141414)}
.playlist-icon{font-size:25px;margin-bottom:12px}
footer{text-align:center;border-top:1px solid #222;padding:25px 10px;color:#777;font-size:10px;letter-spacing:2px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:850px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
  <div class="logo">MY <span class="red">FAV</span><br>PLAYLISTE</div>
  <div class="subtitle">SOUND • SHADOW • SILENCE</div>
  <div class="status">◉ MY WORLD / YOUR ACCESS</div>
</header>
<main>
  <div class="intro">
    Not everything needs to be explained.<br>
    Some sounds say what words cannot.<br>
    <span class="red">Welcome to my world.</span>
  </div>
  <h2>MY SOUNDS / TRACKS</h2>
  <div class="grid" id="songs"></div>
  <h2>COLLECTIONS / PLAYLISTS</h2>
  <div class="grid" id="playlists"></div>
</main>
<footer>MY FAV PLAYLISTE <span class="red">///</span> NO EXPLANATIONS NEEDED</footer>
</body>
</html>
<script>
const songs = [
"qq_aCp70jb0","cpAg-TCLYDk","U39b3uSnETQ",
"1wYNFfgrXTI","NsAA8DaaiXg","-P4PemQEVrM",
"CpkK9YFzmB8","zaaH1LK9FN8","F25R90GeQTM",
"F6aeR1XJaMc","1-oSEz4jUJA","63c-8SC2CG0",
"-jRKsiAOAA8","xLnhtTlwjak","qSCtCTCC2Sg",
"6yDWLC0122o","mU3UT_wIR4w","79tOBHcoXFY",
"WK0vO2b4Wjw"
];

const songGrid = document.getElementById("songs");

songs.forEach((id, index) => {
  const a = document.createElement("a");
  a.className = "card";
  a.href = "https://www.youtube.com/watch?v=" + id;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.innerHTML = `
    <div class="thumb">
      <img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg"
           alt="YouTube thumbnail" loading="lazy">
      <div class="play">▶</div>
    </div>
    <div class="info">
      <div class="number">TRACK ${String(index+1).padStart(2,"0")}</div>
      <div class="name">Unknown Track</div>
      <div class="note">LISTEN ON YOUTUBE ↗</div>
    </div>`;
  songGrid.appendChild(a);
});
</script>
<script>
const playlistIds = [
"PLZWyDkninIsP0-TXvrd7Q-g3-HfHcxTsF",
"PLMTF1RKZJLc2tEob0QTatx3Hq5bzpIje2",
"PLMTF1RKZJLc0c0dx8LBHARZdWpXLx6eRO",
"PLMTF1RKZJLc1BewlAMEuKpnU8Cdfm4jPg",
"PL-avrc8Hpih4q9JWt28bvX2xEOlmq_m7u"
];

const playlistGrid = document.getElementById("playlists");

playlistIds.forEach((id, index) => {
  const a = document.createElement("a");
  a.className = "card playlist";
  a.href = "https://www.youtube.com/playlist?list=" + id;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.innerHTML = `
    <div class="playlist-icon">▤</div>
    <div class="number">COLLECTION ${String(index+1).padStart(2,"0")}</div>
    <div class="name">MY PLAYLIST ${index+1}</div>
    <div class="note">OPEN ON YOUTUBE ↗</div>`;
  playlistGrid.appendChild(a);
});
</script>
