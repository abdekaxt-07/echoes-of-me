<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<meta name="description" content="MY FAV PLAYLISTE — my sound, my world, no explanation.">
<title>MY FAV PLAYLISTE</title>
<style>
:root{color-scheme:dark;--bg:#080808;--panel:#111010;--red:#e11d2e;--red2:#7d0712;--muted:#a7a1a1;--line:#302023;--white:#f5f1f1}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#3b080d 0,transparent 44%),var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif;min-width:0;overflow-x:hidden}a{color:inherit;text-decoration:none}.wrap{width:min(1180px,calc(100% - 36px));margin-inline:auto}.topbar{position:sticky;top:0;z-index:10;background:rgba(8,8,8,.9);backdrop-filter:blur(12px);border-bottom:1px solid #36151a}.nav{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-weight:900;letter-spacing:.09em;font-size:14px}.brand span{color:var(--red)}.navlinks{display:flex;gap:22px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#c9c1c1}.navlinks a:hover{color:#ff4453}.hero{min-height:390px;display:flex;align-items:center;padding:76px 0 65px;position:relative}.hero:after{content:"";position:absolute;right:5%;top:22%;width:150px;height:150px;opacity:.16;background:repeating-linear-gradient(0deg,var(--red) 0 7px,transparent 7px 14px),repeating-linear-gradient(90deg,transparent 0 7px,#ff3445 7px 14px);clip-path:polygon(0 0,100% 0,100% 100%,0 100%);mask-image:linear-gradient(135deg,#000,transparent 80%);pointer-events:none}.eyebrow{color:#ff5360;font:700 11px/1.4 monospace;letter-spacing:.28em;text-transform:uppercase}.hero h1{max-width:800px;margin:14px 0 10px;font-size:clamp(42px,8vw,88px);line-height:.92;letter-spacing:-.055em;font-weight:950;text-transform:uppercase;text-shadow:3px 3px 0 #4d0810}.hero h1 span{color:var(--red)}.hero p{margin:20px 0 28px;color:#c1b8b8;font-size:clamp(12px,2vw,15px);letter-spacing:.19em}.cta{display:inline-flex;align-items:center;gap:10px;border:1px solid #b51b29;background:linear-gradient(110deg,#6f0711,#1a0b0d);padding:13px 17px;font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;transition:transform .2s,border-color .2s}.cta:hover{transform:translateY(-3px);border-color:#ff5260}.section{padding:36px 0 62px}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px;border-bottom:1px solid var(--line);padding-bottom:15px}.sectionhead h2{margin:0;font-size:clamp(23px,4vw,34px);letter-spacing:-.04em;text-transform:uppercase}.sectionhead h2 span{color:var(--red)}.sectionhead p{margin:0;color:var(--muted);font:11px monospace;letter-spacing:.1em}.track-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.track{min-width:0;background:linear-gradient(145deg,#171313,#0c0b0b);border:1px solid #2b2021;overflow:hidden;transition:transform .22s,border-color .22s,box-shadow .22s}.track:hover,.playlist:hover{transform:translateY(-4px);border-color:#a81a28;box-shadow:0 12px 28px #0008,0 0 20px #a10b1715}.cover{aspect-ratio:16/10;position:relative;overflow:hidden;background:#17090c}.cover img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .35s,filter .35s;filter:saturate(.75) contrast(1.05)}.track:hover .cover img{transform:scale(1.05);filter:saturate(1.1)}.cover:after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;color:white;font-size:24px;text-shadow:0 2px 10px #000;background:linear-gradient(0deg,#05050570,transparent 70%);pointer-events:none}.fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;background:repeating-linear-gradient(135deg,#19080b 0 10px,#27090e 10px 20px)}.fallback b{font:900 22px monospace;color:#ff3446;letter-spacing:.1em}.fallback small{font:10px monospace;color:#c99b9f;letter-spacing:.22em}.trackbody{padding:13px 13px 15px}.tracknum{color:#e83b4b;font:10px monospace;letter-spacing:.15em}.track h3{font-size:13px;line-height:1.35;margin:7px 0 4px;overflow-wrap:anywhere}.track p{font-size:11px;color:var(--muted);margin:0;overflow-wrap:anywhere}.playlist-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:15px}.playlist{border:1px solid #302023;background:linear-gradient(145deg,#171313,#0b0a0a);padding:15px;min-width:0;transition:transform .22s,border-color .22s,box-shadow .22s}.playlist-art{aspect-ratio:1;display:grid;place-items:center;position:relative;overflow:hidden;background:linear-gradient(145deg,#400711,#10090a 60%,#22070c);border:1px solid #5a111b;margin-bottom:14px}.playlist-art:before,.playlist-art:after{content:"";position:absolute;background:#ed2438;opacity:.6;image-rendering:pixelated}.playlist-art:before{width:52%;height:12%;left:24%;top:28%;box-shadow:0 18px 0 #a50d20,0 36px 0 #590814}.playlist-art:after{width:12%;height:52%;left:44%;top:24%;opacity:.2}.playlist-art span{position:relative;z-index:1;font:900 clamp(24px,4vw,42px) monospace;color:#fff;text-shadow:3px 3px #9e1020}.playlist small{color:#ed4654;font:10px monospace;letter-spacing:.18em}.playlist h3{margin:7px 0 0;font-size:12px;letter-spacing:.08em;overflow-wrap:anywhere}.footer{border-top:1px solid var(--line);padding:26px 0 34px;color:#938b8c;font:10px monospace;letter-spacing:.13em;text-transform:uppercase}.footer .wrap{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.footer strong{color:#e13a49}.pixel-line{height:4px;background:repeating-linear-gradient(90deg,var(--red) 0 8px,transparent 8px 12px);opacity:.8}
@media(max-width:900px){.track-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.playlist-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero:after{right:0;width:100px;height:100px}}
@media(max-width:600px){.wrap{width:calc(100% - 24px)}.nav{min-height:58px}.brand{font-size:12px}.navlinks{gap:12px;font-size:10px}.hero{min-height:310px;padding:60px 0 50px}.hero:after{top:12%;width:64px;height:64px}.hero p{letter-spacing:.1em;max-width:270px;line-height:1.7}.section{padding:27px 0 44px}.sectionhead{align-items:start;flex-direction:column;gap:7px}.track-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.trackbody{padding:10px}.track h3{font-size:12px}.track p{font-size:10px}.playlist-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.playlist{padding:10px}.playlist h3{font-size:11px}.footer .wrap{flex-direction:column}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="topbar"><div class="wrap nav"><a class="brand" href="#home" aria-label="MY FAV PLAYLISTE home">MY FAV <span>PLAYLISTE</span></a><nav class="navlinks" aria-label="Main navigation"><a href="#tracks">Tracks</a><a href="#playlists">Playlists</a></nav></div></header>
<main id="home">
<section class="hero"><div class="wrap"><div class="eyebrow">/// Personal archive · Vol. 001</div><h1>MY FAV<br><span>PLAYLISTE</span></h1><p>MY SOUND. MY WORLD. NO EXPLANATION.</p><a class="cta" href="#tracks">Explore the sound <span aria-hidden="true">↘</span></a></div></section>
<div class="pixel-line" aria-hidden="true"></div>
<section class="section" id="tracks"><div class="wrap"><div class="sectionhead"><h2>Selected <span>Tracks</span></h2><p>19 TRACKS / CLICK TO LISTEN ↗</p></div><div class="track-grid" id="trackGrid" aria-label="Music tracks"></div></div></section>
<section class="section" id="playlists"><div class="wrap"><div class="sectionhead"><h2>My <span>Playlists</span></h2><p>5 COLLECTIONS / ORIGINAL YOUTUBE LINKS ↗</p></div><div class="playlist-grid" id="playlistGrid" aria-label="YouTube playlists"></div></div></section>
</main>
<footer class="footer"><div class="wrap"><span>© <span id="year"></span> <strong>MY FAV PLAYLISTE</strong></span><span>Curated in silence. Played loud.</span></div></footer>
<script>
'use strict';
const tracks = [
'qq_aCp70jb0','cpAg-TCLYDk','U39b3uSnETQ','1wYNFfgrXTI','NsAA8DaaiXg','-P4PemQEVrM','CpkK9YFzmB8','zaaH1LK9FN8','F25R90GeQTM','F6aeR1XJaMc','1-oSEz4jUJA','63c-8SC2CG0','-jRKsiAOAA8','xLnhtTlwjak','qSCtCTCC2Sg','6yDWLC0122o','mU3UT_wIR4w','79tOBHcoXFY','WK0vO2b4Wjw'
];
const verified = {'1wYNFfgrXTI': {title:"When I'm Gone", artist:'Eminem'}};
const trackGrid = document.getElementById('trackGrid');
tracks.forEach((id,index)=>{
 const meta=verified[id] || {title:'Title unavailable',artist:'Artist unavailable'};
 const a=document.createElement('a'); a.className='track'; a.href='https://www.youtube.com/watch?v='+encodeURIComponent(id); a.target='_blank'; a.rel='noopener noreferrer'; a.setAttribute('aria-label',`Open ${meta.title} on YouTube`);
 const cover=document.createElement('div'); cover.className='cover';
 const img=document.createElement('img'); img.src=`https://img.youtube.com/vi/${id}/hqdefault.jpg`; img.alt=`Thumbnail for ${meta.title}`; img.loading='lazy'; img.onerror=()=>{img.style.display='none'; fallback.style.display='flex';};
 const fallback=document.createElement('div'); fallback.className='fallback'; fallback.innerHTML='<b>MF / PL</b><small>TRACK ARCHIVE</small>';
 cover.append(img,fallback);
 const body=document.createElement('div'); body.className='trackbody';
 const num=document.createElement('div'); num.className='tracknum'; num.textContent='TRACK / '+String(index+1).padStart(2,'0');
 const h=document.createElement('h3'); h.textContent=meta.title;
 const p=document.createElement('p'); p.textContent=meta.artist;
 body.append(num,h,p); a.append(cover,body); trackGrid.append(a);
});
const playlists=['PLZWyDkninIsP0-TXvrd7Q-g3-HfHcxTsF','PLMTF1RKZJLc2tEob0QTatx3Hq5bzpIje2','PLMTF1RKZJLc0c0dx8LBHARZdWpXLx6eRO','PLMTF1RKZJLc1BewlAMEuKpnU8Cdfm4jPg','PL-avrc8Hpih4q9JWt28bvX2xEOlmq_m7u'];
const playlistGrid=document.getElementById('playlistGrid');
playlists.forEach((id,index)=>{
 const a=document.createElement('a'); a.className='playlist'; a.href='https://www.youtube.com/playlist?list='+encodeURIComponent(id); a.target='_blank'; a.rel='noopener noreferrer'; a.setAttribute('aria-label',`Open playlist ${index+1} on YouTube`);
 const art=document.createElement('div'); art.className='playlist-art'; const mark=document.createElement('span'); mark.textContent=String(index+1).padStart(2,'0'); art.append(mark);
 const small=document.createElement('small'); small.textContent='PLAYLIST / 0'+(index+1);
 const h=document.createElement('h3'); h.textContent='MY PLAYLIST '+String(index+1).padStart(2,'0');
 a.append(art,small,h); playlistGrid.append(a);
});
document.getElementById('year').textContent=new Date().getFullYear();
</script>
</body>
</html>
